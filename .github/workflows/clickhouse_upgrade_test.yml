# Runs the ClickHouse cluster upgrade test (scripts/clickhouse-upgrade-test/)
# against a throwaway 3-node cluster shaped like production's oonidata_cluster.
#
# Each hop / node-upgrade is its own job step (via ci_step.py) rather than one
# opaque "run the whole thing" step, so a failure localizes to exactly which
# version transition broke, with its own checkmark and log in the GitHub UI.
#
# See scripts/clickhouse-upgrade-test/README.md and sql/001_schema.sql for
# the full writeup of why the upgrade path is staged through LTS releases
# instead of jumping straight to latest.
on:
  workflow_dispatch:
    inputs:
      scenario:
        description: "Which upgrade path(s) to run"
        type: choice
        options:
          - both
          - staged
          - direct
          - real-data
          - all
          - aggressive-skip
        default: both
  pull_request:
    paths:
      - "scripts/clickhouse-upgrade-test/**"
      - "ansible/group_vars/clickhouse/vars.yml"
      - ".github/workflows/clickhouse_upgrade_test.yml"
  push:
    branches:
      - main
    paths:
      - "scripts/clickhouse-upgrade-test/**"
      - "ansible/group_vars/clickhouse/vars.yml"

jobs:
  # Recommended path: 24.8.6.70 -> 25.3.14.14 -> 25.8.29.51 -> 26.3.17.110 ->
  # 26.8.9.10, one LTS hop at a time, one node at a time within each hop.
  # This is the upgrade path OONI should actually follow.
  staged-upgrade:
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.scenario == 'both' || github.event.inputs.scenario == 'staged'
    runs-on: ubuntu-latest
    # Back down from 90 -> 60: this job now runs RECOMMENDED_LTS_HOPS's 4 hops
    # instead of LTS_HOPS's 8 -- see harness/versions.py's "REDUCING THE
    # CI LADDER" section. The monthly bisection releases localized the
    # mark-file incompatibility to exactly one version boundary; re-testing
    # every one of them on every PR was no longer buying anything.
    timeout-minutes: 60
    defaults:
      run:
        working-directory: scripts/clickhouse-upgrade-test
    steps:
      - uses: actions/checkout@v4

      # Fails loudly if harness/versions.py is edited without updating the
      # hardcoded step list below (or vice versa) -- the two have no other
      # link between them, so silent drift would otherwise just quietly test
      # the wrong path.
      - name: Sanity-check version ladder matches harness/versions.py
        run: |
          python3 - <<'EOF'
          from harness.versions import BASE_VERSION, LATEST_VERSION, RECOMMENDED_LTS_HOPS
          # This job now runs RECOMMENDED_LTS_HOPS directly (4 hops), not the
          # historical 8-hop LTS_HOPS monthly-bisection ladder -- that
          # ladder's only purpose was localizing which release introduced
          # the mark-file incompatibility, and that question is answered
          # (see harness/versions.py's module docstring, "REDUCING THE CI
          # LADDER" section).
          expected_hops = [
              "25.3.14.14",
              "25.8.29.51",
              "26.3.17.110",
              "26.8.9.10",
          ]
          actual_hops = [v for v, _ in RECOMMENDED_LTS_HOPS[1:]]
          assert BASE_VERSION == "24.8.6.70", (
              f"harness/versions.py BASE_VERSION is now {BASE_VERSION!r} -- "
              "update this workflow's steps (and the assertions here) to match"
          )
          assert LATEST_VERSION == "26.8.9.10", (
              f"harness/versions.py LATEST_VERSION is now {LATEST_VERSION!r} -- "
              "update this workflow's steps (and the assertions here) to match"
          )
          assert actual_hops == expected_hops, (
              f"harness/versions.py RECOMMENDED_LTS_HOPS is now {actual_hops} -- "
              "update this workflow's steps (and the assertions here) to match"
          )
          print("OK: workflow version ladder matches harness/versions.py RECOMMENDED_LTS_HOPS")
          EOF

      - name: Validate docker-compose.yml
        run: docker compose config

      - name: Set up cluster at 24.8.6.70 (current production version) and load schema + seed data
        run: python3 ci_step.py setup --base-version 24.8.6.70 --label setup

      # --- Hop 1/4: 24.8.6.70 -> 25.3.14.14 (LTS) ---
      - name: "Hop 1/4 (-> 25.3.14.14): upgrade ch1"
        run: python3 ci_step.py upgrade-node --node ch1 --version 25.3.14.14 --label hop1-ch1
        continue-on-error: true
      - name: "Hop 1/4 (-> 25.3.14.14): upgrade ch2"
        run: python3 ci_step.py upgrade-node --node ch2 --version 25.3.14.14 --label hop1-ch2
        continue-on-error: true
      - name: "Hop 1/4 (-> 25.3.14.14): upgrade ch3"
        run: python3 ci_step.py upgrade-node --node ch3 --version 25.3.14.14 --label hop1-ch3
        continue-on-error: true
      - name: "Hop 1/4 (-> 25.3.14.14): verify ON CLUSTER DDL"
        run: python3 ci_step.py verify-ddl --version 25.3.14.14 --label hop1-verify-ddl
        continue-on-error: true

      # Per-hop data-integrity gate: does the seed data loaded before any
      # hop (probe rows from the per-step write-then-read-back checks
      # excluded) still checksum-match, on all 3 nodes, now that THIS hop
      # has run? Checked after every hop (not just once at the very end --
      # see harness/scenarios.py's content_integrity_step() and
      # scenario_staged_lts()) so a corrupting release is pinpointed to the
      # specific hop that introduced it, rather than only surfacing as
      # "something in the whole rollout broke it" once every hop has
      # already run. Like the old end-of-rollout version of this check,
      # this is NOT eligible for the self-healing exception (see
      # harness/report.py's self_healed()/overall_ok()) -- it always gates.
      - name: "Hop 1/4 (-> 25.3.14.14): verify no data loss or corruption (content checksums vs. golden seed snapshot)"
        run: python3 ci_step.py content-integrity --label hop1-content-integrity
        continue-on-error: true

      # --- Hop 2/4: 25.3.14.14 -> 25.8.29.51 (LTS) -- previously this job
      # only ever tested this transition via the bisected monthly-release
      # ladder; this is now the first CI coverage of the actual un-bisected
      # jump production would take (closing the gap called out in
      # harness/versions.py's module docstring). Expect ch3 (the trailing
      # node) to log hard-looking errors (NO_FILE_IN_DATA_PART) until its
      # own upgrade at hop2-ch3 completes -- see harness/versions.py's
      # "self-heals once the lagging node catches up" section. ---
      - name: "Hop 2/4 (-> 25.8.29.51): upgrade ch1"
        run: python3 ci_step.py upgrade-node --node ch1 --version 25.8.29.51 --label hop2-ch1
        continue-on-error: true
      - name: "Hop 2/4 (-> 25.8.29.51): upgrade ch2"
        run: python3 ci_step.py upgrade-node --node ch2 --version 25.8.29.51 --label hop2-ch2
        continue-on-error: true
      - name: "Hop 2/4 (-> 25.8.29.51): upgrade ch3"
        run: python3 ci_step.py upgrade-node --node ch3 --version 25.8.29.51 --label hop2-ch3
        continue-on-error: true
      - name: "Hop 2/4 (-> 25.8.29.51): verify ON CLUSTER DDL"
        run: python3 ci_step.py verify-ddl --version 25.8.29.51 --label hop2-verify-ddl
        continue-on-error: true

      # Per-hop data-integrity gate -- see hop 1's equivalent step above for
      # the full rationale.
      - name: "Hop 2/4 (-> 25.8.29.51): verify no data loss or corruption (content checksums vs. golden seed snapshot)"
        run: python3 ci_step.py content-integrity --label hop2-content-integrity
        continue-on-error: true

      # --- Hop 3/4: 25.8.29.51 -> 26.3.17.110 (LTS) -- the nested-data-type
      # serialization change flagged in the ooni/devops#477 review; same
      # self-healing pattern expected on the trailing node. ---
      - name: "Hop 3/4 (-> 26.3.17.110): upgrade ch1"
        run: python3 ci_step.py upgrade-node --node ch1 --version 26.3.17.110 --label hop3-ch1
        continue-on-error: true
      - name: "Hop 3/4 (-> 26.3.17.110): upgrade ch2"
        run: python3 ci_step.py upgrade-node --node ch2 --version 26.3.17.110 --label hop3-ch2
        continue-on-error: true
      - name: "Hop 3/4 (-> 26.3.17.110): upgrade ch3"
        run: python3 ci_step.py upgrade-node --node ch3 --version 26.3.17.110 --label hop3-ch3
        continue-on-error: true
      - name: "Hop 3/4 (-> 26.3.17.110): verify ON CLUSTER DDL"
        run: python3 ci_step.py verify-ddl --version 26.3.17.110 --label hop3-verify-ddl
        continue-on-error: true

      # Per-hop data-integrity gate -- see hop 1's equivalent step above for
      # the full rationale.
      - name: "Hop 3/4 (-> 26.3.17.110): verify no data loss or corruption (content checksums vs. golden seed snapshot)"
        run: python3 ci_step.py content-integrity --label hop3-content-integrity
        continue-on-error: true

      # --- Hop 4/4: 26.3.17.110 -> 26.8.9.10 (LTS, retargeted 2026-09-21 from
      # 26.7.3.19 -- see harness/versions.py's "RETARGETED" section). Run
      # 96404459255 (the first against this retargeted ladder) directly
      # confirmed the same self-healing pattern holds here too (hop4-ch1
      # hit CHECKSUM_DOESNT_MATCH, cleared by hop4-ch2/ch3/verify-ddl) --
      # see harness/versions.py's "RETARGETED, continued" section. ---
      - name: "Hop 4/4 (-> 26.8.9.10): upgrade ch1"
        run: python3 ci_step.py upgrade-node --node ch1 --version 26.8.9.10 --label hop4-ch1
        continue-on-error: true
      - name: "Hop 4/4 (-> 26.8.9.10): upgrade ch2"
        run: python3 ci_step.py upgrade-node --node ch2 --version 26.8.9.10 --label hop4-ch2
        continue-on-error: true
      - name: "Hop 4/4 (-> 26.8.9.10): upgrade ch3"
        run: python3 ci_step.py upgrade-node --node ch3 --version 26.8.9.10 --label hop4-ch3
        continue-on-error: true
      - name: "Hop 4/4 (-> 26.8.9.10): verify ON CLUSTER DDL"
        run: python3 ci_step.py verify-ddl --version 26.8.9.10 --label hop4-verify-ddl
        continue-on-error: true

      # Per-hop data-integrity gate -- see hop 1's equivalent step above for
      # the full rationale. This is also, as a side effect of being the
      # last hop, the "did the rollout end with no data loss or corruption"
      # answer -- there is no separate end-of-rollout-only check anymore,
      # since checking after every hop (including this one) subsumes it: a
      # hard-looking error from e.g. hop2-ch2/hop3-ch2/hop4-ch1 above that
      # cleared by its own hop's verify-ddl no longer fails the job on its
      # own (see harness/report.py's self_healed()/overall_ok()), but any
      # one of these per-hop content-integrity steps failing always does.
      - name: "Hop 4/4 (-> 26.8.9.10): verify no data loss or corruption (content checksums vs. golden seed snapshot)"
        run: python3 ci_step.py content-integrity --label hop4-content-integrity
        continue-on-error: true

      - name: Generate report
        if: always()
        run: python3 ci_step.py report

      - name: Upload report + per-step results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clickhouse-staged-upgrade-report
          path: scripts/clickhouse-upgrade-test/results/
          retention-days: 30

      - name: Tear down cluster
        if: always()
        run: python3 ci_step.py teardown

  # Real-data end-to-end scenario (ooni/data#437 follow-up, ooni/data#160):
  # does the actual OONI ingestion pipeline -- real measurements, downloaded
  # and submitted through fastpath/oonipipeline, then queried through the
  # real api-oonimeasurements service -- still work after each hop of
  # RECOMMENDED_LTS_HOPS? Separate from staged-upgrade above, which uses fast
  # synthetic seed data to check ClickHouse's own replication mechanics
  # across every bisection waypoint; this one is slower, has a real
  # external git + network dependency, and walks the actual 4-hop
  # production runbook rather than every diagnostic waypoint. See
  # harness/real_data.py and README.md's "real-data-upgrade" section for
  # the full design (load real data once, re-verify integrity + the real
  # pytest suite at every hop).
  #
  # Deliberately NOT run on pull_request (unlike staged-upgrade /
  # direct-jump-upgrade above): it checks out an unmerged external branch
  # (ooni/data's add_end_to_end_tests, ooni/data#160) this repo doesn't
  # control, plus does real network downloads of OONI measurement data --
  # a flaky/slow dependency there shouldn't block unrelated PRs to this
  # repo. Runs on push to main (when these paths change) and on-demand via
  # workflow_dispatch (scenario: real-data or all) instead.
  real-data-upgrade:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (github.event.inputs.scenario == 'all' || github.event.inputs.scenario == 'real-data'))
    runs-on: ubuntu-latest
    # Real network download of OONI measurement data + oonipipeline/fastpath
    # processing (once), plus 4 hops x (3 node upgrades + an integrity
    # re-check + a full pytest run against the real API), all run inside one
    # zero-downtime-upgrade step now (see harness/availability.py) so a
    # single background canary thread can keep issuing reads/writes across
    # every hop without pausing -- substantially slower than
    # staged-upgrade's synthetic-data hops.
    timeout-minutes: 120
    defaults:
      run:
        working-directory: scripts/clickhouse-upgrade-test
    steps:
      - uses: actions/checkout@v4

      # ooni/data#160 (branch add_end_to_end_tests) is still an open,
      # unmerged PR as of this writing -- see docker-compose.real-data.yml's
      # header comment for why this pins to the branch instead of main.
      # Update this ref once #160 merges.
      - name: Checkout ooni/data (add_end_to_end_tests branch)
        uses: actions/checkout@v4
        with:
          repository: ooni/data
          ref: add_end_to_end_tests
          path: external/ooni-data

      - name: Sanity-check hop ladder matches harness/versions.py RECOMMENDED_LTS_HOPS
        run: |
          python3 - <<'EOF'
          from harness.versions import RECOMMENDED_LTS_HOPS
          expected = [
              "24.8.6.70",
              "25.3.14.14",
              "25.8.29.51",
              "26.3.17.110",
              "26.8.9.10",
          ]
          actual = [v for v, _ in RECOMMENDED_LTS_HOPS]
          assert actual == expected, (
              f"harness/versions.py RECOMMENDED_LTS_HOPS is now {actual} -- "
              "update this workflow's steps (and the assertions here) to match"
          )
          print("OK: workflow hop ladder matches harness/versions.py RECOMMENDED_LTS_HOPS")
          EOF

      - name: Validate docker-compose.yml + docker-compose.real-data.yml
        run: docker compose -f docker-compose.yml -f docker-compose.real-data.yml config

      - name: Set up cluster at 24.8.6.70 (schema only -- no synthetic seed data)
        run: python3 ci_step.py setup-real-data --base-version 24.8.6.70 --label setup-real-data

      - name: Load real OONI data once (oonidata sync + oonipipeline + fastpath)
        run: python3 ci_step.py load-real-data --label load-real-data

      - name: Take golden snapshot (row counts + checksums, all 3 nodes must agree)
        run: python3 ci_step.py golden-snapshot --label golden-snapshot

      - name: Sanity-check ooni/data's pytest suite passes at 24.8.6.70 before any upgrade
        run: python3 ci_step.py verify-e2e --label base-verify-e2e

      # --- All 4 remaining RECOMMENDED_LTS_HOPS hops, back-to-back, with a
      # continuous read/write canary running underneath the whole time --
      # see harness/availability.py. This replaces the four separate
      # real-data-hop steps that used to run here (24.8.6.70 -> 25.3.14.14
      # -> 25.8.29.51 -> 26.3.17.110 -> 26.8.9.10, each its own step): the
      # per-hop integrity/pytest checks those did are still done here, once
      # per hop, but they can no longer be split across separate GitHub
      # Actions steps, because the whole point is a single background
      # canary thread that keeps issuing reads/writes across ALL of them
      # without ever stopping -- splitting into per-hop steps would mean
      # restarting (and re-justifying the continuity of) the canary between
      # every hop, which defeats the purpose. Per-hop failures still don't
      # abort this step early (same as before): each node upgrade inside
      # run_zero_downtime_upgrade() is caught and recorded rather than
      # raised, so e.g. hop2/hop3's expected trailing-node errors (see
      # harness/versions.py's "self-heals once the lagging node catches up"
      # section) don't stop the remaining hops or the canary from running to
      # completion -- only the final report step's exit code actually fails
      # the job if something never cleared.
      - name: "Zero-downtime upgrade proof: all 4 remaining RECOMMENDED_LTS_HOPS hops, continuous read/write canary throughout"
        run: python3 ci_step.py zero-downtime-upgrade --label zero-downtime-upgrade
        continue-on-error: true

      - name: Generate report
        if: always()
        run: python3 ci_step.py report

      - name: Upload report + per-step results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clickhouse-real-data-upgrade-report
          path: scripts/clickhouse-upgrade-test/results/
          retention-days: 30

      - name: Tear down cluster + real-data stack
        if: always()
        run: python3 ci_step.py teardown-real-data

  # Naive path: straight from 24.8.6.70 to 26.8.9.10, node by node, skipping
  # every intermediate LTS release. Expected to demonstrate ClickHouse's own
  # documented ~1 year mixed-version compatibility limit, so this job is
  # allowed to fail without failing the whole workflow (continue-on-error) --
  # it's diagnostic/documentary, not a gate.
  direct-jump-upgrade:
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.scenario == 'both' || github.event.inputs.scenario == 'direct'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    defaults:
      run:
        working-directory: scripts/clickhouse-upgrade-test
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        run: docker compose config

      - name: Set up cluster at 24.8.6.70 (current production version) and load schema + seed data
        run: python3 ci_step.py setup --base-version 24.8.6.70 --label setup

      - name: "Direct jump (-> 26.8.9.10, skips all LTS hops): upgrade ch1"
        run: python3 ci_step.py upgrade-node --node ch1 --version 26.8.9.10 --label direct-ch1
        continue-on-error: true
      - name: "Direct jump (-> 26.8.9.10, skips all LTS hops): upgrade ch2"
        run: python3 ci_step.py upgrade-node --node ch2 --version 26.8.9.10 --label direct-ch2
        continue-on-error: true
      - name: "Direct jump (-> 26.8.9.10, skips all LTS hops): upgrade ch3"
        run: python3 ci_step.py upgrade-node --node ch3 --version 26.8.9.10 --label direct-ch3
        continue-on-error: true

      - name: "Direct jump (-> 26.8.9.10, skips all LTS hops): verify ON CLUSTER DDL"
        run: python3 ci_step.py verify-ddl --version 26.8.9.10 --label direct-verify-ddl
        continue-on-error: true

      # Same per-hop data-integrity gate as each hop of staged-upgrade above
      # (see that job's hop 1 step for the full rationale) -- there's only
      # one hop here, so it's simultaneously "per-hop" and "end-of-rollout".
      - name: "Direct jump (-> 26.8.9.10): verify no data loss or corruption (content checksums vs. golden seed snapshot)"
        run: python3 ci_step.py content-integrity --label direct-content-integrity
        continue-on-error: true

      - name: Generate report
        if: always()
        run: python3 ci_step.py report

      - name: Upload report + per-step results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clickhouse-direct-jump-report
          path: scripts/clickhouse-upgrade-test/results/
          retention-days: 30

      - name: Tear down cluster
        if: always()
        run: python3 ci_step.py teardown

  # EXPERIMENTAL: trials the 2-hop skip-ladder allowed under ClickHouse's
  # documented compatibility rule ("less than one year... or less than two
  # LTS versions between them" -- https://clickhouse.com/docs/operations/update)
  # but never used in production and not covered by staged-upgrade above.
  # See harness/versions.py's module docstring ("AGGRESSIVE_SKIP_HOPS") for
  # the full rationale -- this exists purely to gather evidence on whether
  # skipping 25.3.14.14 and 26.3.17.110 entirely is actually safe, not to
  # validate a path OONI intends to run. A green run here is NOT sufficient
  # justification to promote this to RECOMMENDED_LTS_HOPS.
  #
  # workflow_dispatch only (scenario: aggressive-skip) -- deliberately not
  # part of "both" (keeps routine PR/push runs conservative) or "all"
  # (which today only adds real-data-upgrade on top of the push/PR set, not
  # staged/direct either -- see real-data-upgrade above), so this only ever
  # runs when explicitly requested.
  aggressive-skip-upgrade:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.scenario == 'aggressive-skip'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    defaults:
      run:
        working-directory: scripts/clickhouse-upgrade-test
    steps:
      - uses: actions/checkout@v4

      # Fails loudly if harness/versions.py is edited without updating the
      # hardcoded step list below (or vice versa).
      - name: Sanity-check version ladder matches harness/versions.py
        run: |
          python3 - <<'EOF'
          from harness.versions import BASE_VERSION, LATEST_VERSION, AGGRESSIVE_SKIP_HOPS
          expected_hops = [
              "25.8.29.51",
              "26.8.9.10",
          ]
          actual_hops = [v for v, _ in AGGRESSIVE_SKIP_HOPS[1:]]
          assert BASE_VERSION == "24.8.6.70", (
              f"harness/versions.py BASE_VERSION is now {BASE_VERSION!r} -- "
              "update this workflow's steps (and the assertions here) to match"
          )
          assert LATEST_VERSION == "26.8.9.10", (
              f"harness/versions.py LATEST_VERSION is now {LATEST_VERSION!r} -- "
              "update this workflow's steps (and the assertions here) to match"
          )
          assert actual_hops == expected_hops, (
              f"harness/versions.py AGGRESSIVE_SKIP_HOPS is now {actual_hops} -- "
              "update this workflow's steps (and the assertions here) to match"
          )
          print("OK: workflow version ladder matches harness/versions.py AGGRESSIVE_SKIP_HOPS")
          EOF

      - name: Validate docker-compose.yml
        run: docker compose config

      - name: Set up cluster at 24.8.6.70 (current production version) and load schema + seed data
        run: python3 ci_step.py setup --base-version 24.8.6.70 --label setup

      # --- EXPERIMENTAL Hop 1/2: 24.8.6.70 -> 25.8.29.51, skipping
      # 25.3.14.14 entirely (only 1 LTS version -- 25.3 -- in between, so
      # still within ClickHouse's documented ceiling). Untested before this
      # job existed; expect the same self-healing NO_FILE_IN_DATA_PART
      # pattern on the trailing node that staged-upgrade sees at its
      # equivalent (smaller) hop, possibly worse given the larger jump. ---
      - name: "EXPERIMENTAL Hop 1/2 (-> 25.8.29.51, skips 25.3.14.14): upgrade ch1"
        run: python3 ci_step.py upgrade-node --node ch1 --version 25.8.29.51 --label skip-hop1-ch1
        continue-on-error: true
      - name: "EXPERIMENTAL Hop 1/2 (-> 25.8.29.51, skips 25.3.14.14): upgrade ch2"
        run: python3 ci_step.py upgrade-node --node ch2 --version 25.8.29.51 --label skip-hop1-ch2
        continue-on-error: true
      - name: "EXPERIMENTAL Hop 1/2 (-> 25.8.29.51, skips 25.3.14.14): upgrade ch3"
        run: python3 ci_step.py upgrade-node --node ch3 --version 25.8.29.51 --label skip-hop1-ch3
        continue-on-error: true
      - name: "EXPERIMENTAL Hop 1/2 (-> 25.8.29.51, skips 25.3.14.14): verify ON CLUSTER DDL"
        run: python3 ci_step.py verify-ddl --version 25.8.29.51 --label skip-hop1-verify-ddl
        continue-on-error: true

      # Per-hop data-integrity gate -- same rationale as staged-upgrade's
      # equivalent step (see that job's hop 1 step), applied here too so a
      # corrupting release is pinpointed to whichever of these two
      # (larger-than-normal) EXPERIMENTAL hops actually introduced it.
      - name: "EXPERIMENTAL Hop 1/2 (-> 25.8.29.51, skips 25.3.14.14): verify no data loss or corruption (content checksums vs. golden seed snapshot)"
        run: python3 ci_step.py content-integrity --label skip-hop1-content-integrity
        continue-on-error: true

      # --- EXPERIMENTAL Hop 2/2: 25.8.29.51 -> 26.8.9.10, skipping
      # 26.3.17.110 entirely (only 1 LTS version -- 26.3 -- in between).
      # Combines two independently-observed incompatibility boundaries
      # (25.8's mark-file format change, 26.3's nested-type serialization
      # change) into one bigger hop that has never actually been run.
      # Retargeted 2026-09-21 from 26.7.3.19 (never itself LTS) to 26.8.9.10
      # (the current LTS) -- see harness/versions.py's "RETARGETED"
      # section. ---
      - name: "EXPERIMENTAL Hop 2/2 (-> 26.8.9.10, skips 26.3.17.110): upgrade ch1"
        run: python3 ci_step.py upgrade-node --node ch1 --version 26.8.9.10 --label skip-hop2-ch1
        continue-on-error: true
      - name: "EXPERIMENTAL Hop 2/2 (-> 26.8.9.10, skips 26.3.17.110): upgrade ch2"
        run: python3 ci_step.py upgrade-node --node ch2 --version 26.8.9.10 --label skip-hop2-ch2
        continue-on-error: true
      - name: "EXPERIMENTAL Hop 2/2 (-> 26.8.9.10, skips 26.3.17.110): upgrade ch3"
        run: python3 ci_step.py upgrade-node --node ch3 --version 26.8.9.10 --label skip-hop2-ch3
        continue-on-error: true
      - name: "EXPERIMENTAL Hop 2/2 (-> 26.8.9.10, skips 26.3.17.110): verify ON CLUSTER DDL"
        run: python3 ci_step.py verify-ddl --version 26.8.9.10 --label skip-hop2-verify-ddl
        continue-on-error: true

      # Per-hop data-integrity gate -- see hop 1's equivalent step above for
      # the full rationale. This is also, as a side effect of being the
      # last hop, the "did the rollout end with no data loss or corruption"
      # answer -- there is no separate end-of-rollout-only check anymore.
      - name: "EXPERIMENTAL Hop 2/2 (-> 26.8.9.10, skips 26.3.17.110): verify no data loss or corruption (content checksums vs. golden seed snapshot)"
        run: python3 ci_step.py content-integrity --label skip-hop2-content-integrity
        continue-on-error: true

      - name: Generate report
        if: always()
        run: python3 ci_step.py report

      - name: Upload report + per-step results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clickhouse-aggressive-skip-upgrade-report
          path: scripts/clickhouse-upgrade-test/results/
          retention-days: 30

      - name: Tear down cluster
        if: always()
        run: python3 ci_step.py teardown
