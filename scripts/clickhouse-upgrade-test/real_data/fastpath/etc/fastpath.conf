[DEFAULT]
# Adapted from ooni/data#160 (tests/integration/fastpath/etc/fastpath.conf):
# only clickhouse_url changed, to point at this project's ch1 (default
# user, no password) instead of ooni/data's own single-node "clickhouse"
# service (testuser/testuser). Everything else copied as-is.

# Collector hostnames, comma separated
collectors = localhost
clickhouse_url = clickhouse://default:@ch1:9000/ooni
# S3 access credentials
# Currently unused
s3_access_key =
s3_secret_key =

debug = true
msmt_spool_dir = /data/
