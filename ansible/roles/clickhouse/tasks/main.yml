---

- name: CLICKHOUSE | Install
  ansible.builtin.include_tasks: "install-{{ ansible_os_family | capitalize }}.yml"
  tags:
    - clickhouse_install

- name: CLICKHOUSE | Configure clickhouse
  ansible.builtin.include_tasks: config/clickhouse.yml
  tags:
    - clickhouse_configure

# clickhouse-client runs as the admin user, for the checks after a restart and the
# SQL-driven users, quotas and grants, reading its credentials from this file, so
# that no password is on a command line or in task output.
- name: CLICKHOUSE | Admin client configuration
  ansible.builtin.template:
    src: admin-client.xml.j2
    dest: "{{ clickhouse_admin_client_config }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  diff: false
  check_mode: false  # the checks below read it, in --check too
  tags:
    - clickhouse_service
    - clickhouse_quotas
    - clickhouse_users
    - clickhouse_grants

- name: CLICKHOUSE | ClickHouse Service
  ansible.builtin.include_tasks: service/clickhouse.yml
  tags:
    - clickhouse_service

- name: CLICKHOUSE | Configure users
  ansible.builtin.include_tasks: config/users.yml
  tags:
    - clickhouse_users
  when: clickhouse_role_manage_users

- name: CLICKHOUSE | Configure quotas
  ansible.builtin.include_tasks: config/quotas.yml
  tags:
    - clickhouse_quotas
  when: clickhouse_role_manage_quotas

- name: CLICKHOUSE | Configure grants
  ansible.builtin.include_tasks: config/grants.yml
  tags:
    - clickhouse_grants
  when: clickhouse_role_manage_grants
