---
# One-time (and idempotent-on-rerun) bootstrap for a host that will run
# tier0 services as blue/green Podman Quadlet units, plus the nginx gateway
# vhost that fronts them. See the Terraform side of this in
# tf/modules/ooniapi_service_deployer (deploy_mode = "blue_green") and its
# files/deploy.py, which is what actually performs each deploy -- this role
# only prepares the host for that job to run against.
#
# Runs as root (become: true at the play level). Each deploy restarts its
# slot's unit as root (via the scoped sudoers rule below).

# The deploy job logs in as this user; it may only run what the sudoers rule
# below allows, so it gets no groups of its own
- name: Check the deploy user's public key is set
  ansible.builtin.assert:
    that: ooniapi_gateway_deploy_ssh_public_key | length > 0
    fail_msg: >-
      Set ooniapi_gateway_deploy_ssh_public_key for {{ inventory_hostname }}
      to the public half of the oonidevops/ooniapi/deploy_ssh_key secret.

- name: Create the deploy user
  ansible.builtin.user:
    name: "{{ ooniapi_gateway_deploy_user }}"
    comment: "ooniapi blue/green deploy job"
    shell: /bin/bash
    create_home: true

- name: Authorize the deploy job's key
  ansible.posix.authorized_key:
    user: "{{ ooniapi_gateway_deploy_user }}"
    key: "{{ ooniapi_gateway_deploy_ssh_public_key }}"
    exclusive: true

- name: Ensure per-service state directories exist
  ansible.builtin.file:
    path: "/etc/ooniapi/{{ item.name }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop: "{{ ooniapi_gateway_services }}"
  loop_control:
    label: "{{ item.name }}"

# Files land here (not shared /tmp) before being moved/installed into
# place, so the env files scp'd in on every deploy are never briefly
# world-readable on their way in -- only the deploy user (and root) can
# even list this directory.
- name: Ensure the deploy user's private staging directory exists
  ansible.builtin.file:
    path: "{{ ooniapi_gateway_staging_dir }}"
    state: directory
    owner: "{{ ooniapi_gateway_deploy_user }}"
    group: "{{ ooniapi_gateway_deploy_user }}"
    mode: "0700"

- name: Check whether each service already has an active_slot marker
  ansible.builtin.stat:
    path: "/etc/ooniapi/{{ item.name }}/active_slot"
  loop: "{{ ooniapi_gateway_services }}"
  loop_control:
    label: "{{ item.name }}"
  register: ooniapi_gateway_active_slot_stat

- name: Seed active_slot with "a" for services deploying for the first time
  ansible.builtin.copy:
    dest: "/etc/ooniapi/{{ item.item.name }}/active_slot"
    content: "a"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ ooniapi_gateway_active_slot_stat.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  when: not item.stat.exists

- name: Check whether each service already has an nginx upstream conf
  ansible.builtin.stat:
    path: "/etc/nginx/conf.d/{{ item.name }}-upstream.conf"
  loop: "{{ ooniapi_gateway_services }}"
  loop_control:
    label: "{{ item.name }}"
  register: ooniapi_gateway_upstream_stat

# Seeded with slot "a" up / "b" down, matching active_slot's "a" default
# above, so the very first `nginx -t` (run when installing the gateway
# vhost below) succeeds before that service's first real deploy has run.
- name: Seed a placeholder upstream conf for services deploying for the first time
  ansible.builtin.copy:
    dest: "/etc/nginx/conf.d/{{ item.item.name }}-upstream.conf"
    content: |
      map "" $ooniapi_cache_version_{{ item.item.name }} {
          default "";
      }
      upstream {{ item.item.name }} {
          server 127.0.0.1:{{ item.item.host_port_a }};
          server 127.0.0.1:{{ item.item.host_port_b }} down;
      }
    owner: root
    group: root
    mode: "0644"
  loop: "{{ ooniapi_gateway_upstream_stat.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  when: not item.stat.exists
  notify: reload ooniapi gateway nginx

# Rootful Podman, from Debian (trixie: Podman 5.4 with Quadlet). The deploy
# job installs each slot as a Quadlet unit; systemd runs it.
- name: Remove Docker, which earlier versions of this role installed
  ansible.builtin.apt:
    name: [docker-ce, docker-ce-cli, containerd.io, docker-compose-plugin]
    state: absent

- name: Remove Docker's apt repository
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: [/etc/apt/sources.list.d/docker.list, /etc/apt/keyrings/docker.asc]

- name: Install Podman
  ansible.builtin.apt:
    name: [podman, netavark, aardvark-dns]
    state: present
    update_cache: true

- name: Make netavark use nftables
  ansible.builtin.copy:
    dest: /etc/containers/containers.conf.d/50-ooniapi-gateway.conf
    content: |
      # Managed by ansible - roles/ooniapi_gateway
      [network]
      firewall_driver = "nftables"
    owner: root
    group: root
    mode: "0644"

- name: Ensure Quadlet's unit directory exists
  ansible.builtin.file:
    path: /etc/containers/systemd
    state: directory
    owner: root
    group: root
    mode: "0755"

# One IPv4 network per service, as Quadlet units: a slot's unit names its
# service's (Network=ooniapi-<service>.network), so systemd starts it first.
# Only nginx on the host reaches the slots, through their loopback ports.
- name: Define each service's network
  ansible.builtin.copy:
    dest: "/etc/containers/systemd/ooniapi-{{ item.name }}.network"
    content: |
      # Managed by ansible - roles/ooniapi_gateway
      [Network]
      NetworkName=ooniapi-{{ item.name }}
      Subnet={{ item.subnet }}
    owner: root
    group: root
    mode: "0644"
  loop: "{{ ooniapi_gateway_services }}"
  loop_control:
    label: "{{ item.name }}"
  notify: restart valkey

- name: Remove the network all services shared before
  ansible.builtin.file:
    path: /etc/containers/systemd/ooniapi.network
    state: absent

# CPU and memory caps, e.g. dev's, which the slots and Valkey run in (Slice=)
- name: Define the slices
  ansible.builtin.copy:
    dest: "/etc/systemd/system/{{ item.name }}.slice"
    content: |
      # Managed by ansible - roles/ooniapi_gateway
      [Slice]
      CPUQuota={{ item.cpu_quota }}
      MemoryMax={{ item.memory_max }}
      CPUWeight={{ item.cpu_weight }}
    owner: root
    group: root
    mode: "0644"
  loop: "{{ ooniapi_gateway_slices }}"
  loop_control:
    label: "{{ item.name }}"
  notify: restart valkey

# Rate limit counters of the services on this host (VALKEY_URL
# valkey://<ooniapi_gateway_valkey_name>:6379), what ElastiCache holds for
# them on ECS. Reachable only on the networks of the services that use it
# (valkey: true), and kept in memory only: losing the counters on a restart resets the limits, as a restart of
# the services would with VALKEY_URL=memory.
- name: Define Valkey's unit
  ansible.builtin.template:
    src: valkey.container.j2
    dest: "/etc/containers/systemd/{{ ooniapi_gateway_valkey_name }}.container"
    owner: root
    group: root
    mode: "0644"
  notify: restart valkey

- name: Run Valkey
  ansible.builtin.systemd_service:
    name: "{{ ooniapi_gateway_valkey_name }}.service"
    state: started
    daemon_reload: true

- name: Ensure sudoers.d directory exists
  ansible.builtin.file:
    path: /etc/sudoers.d
    state: directory
    owner: root
    group: root

- name: Install scoped sudoers rule for the deploy user
  ansible.builtin.template:
    src: sudoers-ooniapi-deploy.j2
    dest: /etc/sudoers.d/90-ooniapi-deploy
    owner: root
    group: root
    mode: "0440"
    validate: "visudo -cf %s"

# worker_shutdown_timeout is only valid in nginx's main context, which
# conf.d can't reach; modules-enabled/*.conf is included there by both the
# nginx role's nginx.conf and Debian's stock one.
- name: Bound how long old nginx workers drain after a reload
  ansible.builtin.copy:
    dest: /etc/nginx/modules-enabled/90-ooniapi-gateway-drain.conf
    content: |
      # Managed by ansible - roles/ooniapi_gateway (ooniapi_gateway_drain_timeout)
      worker_shutdown_timeout {{ ooniapi_gateway_drain_timeout }}s;
    owner: root
    group: root
    mode: "0644"
  notify: reload ooniapi gateway nginx

- name: Derive and check the gateway's locations
  ansible.builtin.import_tasks: routes.yml

- name: Ensure the gateway's cache directories exist
  ansible.builtin.file:
    path: "{{ ooniapi_gateway_cache_dir }}/{{ item }}"
    state: directory
    owner: "{{ ooniapi_gateway_nginx_user }}"
    group: "{{ ooniapi_gateway_nginx_user }}"
    mode: "0700"
  loop: "{{ ooniapi_gateway_cache_zones.keys() | list }}"

- name: Render the gateway vhost
  ansible.builtin.template:
    src: gateway.conf.j2
    dest: /etc/nginx/conf.d/ooniapi-gateway.conf.pending
    owner: root
    group: root
    mode: "0644"

# Split into "render" + "install" so a bad template is visible
# (.conf.pending) without ever being loaded by nginx, and so the vhost is
# never installed at all until ooniapi_gateway_cert_ready is true -- see
# defaults/main.yml for why that's a separate, deliberate step.
- name: Install the gateway vhost now that its cert is ready
  ansible.builtin.copy:
    remote_src: true
    src: /etc/nginx/conf.d/ooniapi-gateway.conf.pending
    dest: /etc/nginx/conf.d/ooniapi-gateway.conf
    owner: root
    group: root
    mode: "0644"
  when: ooniapi_gateway_cert_ready
  notify: reload ooniapi gateway nginx
