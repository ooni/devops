# Renders the role's templates and Alertmanager's into work/, with vars.yml
- hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../defaults/main.yml
    - vars.yml
  tasks:
    - name: Render the backup script's configs
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../templates/clickhouse-backup.json.j2"
        dest: "{{ playbook_dir }}/work/{{ item.name }}.json"
        mode: "0644"
      vars:
        clickhouse_backup_jobs: "{{ item.jobs }}"
        clickhouse_backup_max_bandwidth: "{{ item.bandwidth }}"
        clickhouse_backup_check_cluster: "{{ item.check_cluster | default('') }}"
      loop: "{{ test_configs }}"

    # From group_vars/clickhouse, as the hosts get them, so the tests check
    # that they're enough. Read as YAML, not as variables: the file's other
    # values look up secrets.
    - name: Render the backup user's grants
      ansible.builtin.copy:
        dest: "{{ playbook_dir }}/work/backup_user.sql"
        mode: "0644"
        content: |
          CREATE USER backup IDENTIFIED BY 'backup';
          {% for g in grants if 'backup' in g.to %}{% for db in g.databases %}{% for t in g.tables %}
          GRANT {{ g.privileges | join(', ') }} ON {{ db }}.{{ t }} TO backup;
          {% endfor %}{% endfor %}{% endfor %}
      vars:
        grants: "{{ (lookup('file', playbook_dir ~ '/../../../group_vars/clickhouse/vars.yml') | from_yaml).clickhouse_custom_grants }}"

    - name: Render ClickHouse's bucket credentials, for every bucket of every config
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../templates/ooni_backup_s3.xml.j2"
        dest: "{{ playbook_dir }}/work/ooni_backup_s3.xml"
        mode: "0644"
      vars:
        clickhouse_backup_jobs: "{{ test_configs | map(attribute='jobs') | flatten }}"

    - name: Render Alertmanager's config, with Slack and the mail server stood in for
      ansible.builtin.template:
        src: "{{ playbook_dir }}/work/alertmanager.yml.j2"
        dest: "{{ playbook_dir }}/work/alertmanager.yml"
        mode: "0644"
      vars:
        alertmanager_slack_api_url: http://slack:8080/
        am_mx_openobservatory: mx.invalid
