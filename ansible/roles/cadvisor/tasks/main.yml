---
- name: Install cAdvisor
  ansible.builtin.get_url:
    url: "{{ cadvisor_download_url }}"
    dest: "{{ cadvisor_bin_path }}"
    checksum: "sha256:{{ cadvisor_sha256 }}"
    owner: root
    group: root
    mode: "0755"
  notify: restart cadvisor

# cAdvisor names containers through Podman's API
- name: Enable Podman's API socket
  ansible.builtin.systemd_service:
    name: podman.socket
    state: started
    enabled: true

- name: Define cAdvisor's unit
  ansible.builtin.template:
    src: cadvisor.service.j2
    dest: /etc/systemd/system/cadvisor.service
    owner: root
    group: root
    mode: "0644"
  notify: restart cadvisor

- name: Run cAdvisor
  ansible.builtin.systemd_service:
    name: cadvisor.service
    state: started
    enabled: true
    daemon_reload: true
