- name: reload nginx
  service:
    name: nginx
    state: reloaded

- name: restart nginx
  service:
    name: nginx
    state: restarted

- name: reload nftables
  service: 
    name: nftables
    state: reloaded

- name: restart dehydrated
  service:
    name: dehydrated
    state: restarted
    enabled: yes
