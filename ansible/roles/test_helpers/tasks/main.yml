---

# For prometheus scrape requests
- name: Allow traffic on port 9100
  become: true
  tags: prometheus-proxy
  blockinfile:
    path: /etc/ooni/nftables/tcp/9100.nft
    create: yes
    block: |
      add rule inet filter input tcp dport 9100 counter accept comment "node exporter"
  notify:
   - reload nftables

# Create test helpers user
- name: Create the testhelpers user
  ansible.builtin.user:
    name: "testhelpers"
    shell: "/bin/bash"
    create_home: no
    system: yes
  become: yes

# Install test helpers
#
# TODO(test-helpers-source-build): building from source here until
# ooni/ooniprobe-rs has a release workflow that publishes precompiled
# test-helpers binaries. Switch back to downloading+checksumming a release
# tarball once that exists (see git history of this role for the previous
# get_url/checksum-based approach).

- name: Install build dependencies
  ansible.builtin.apt:
    name:
      - git
      - curl
      - build-essential
      - pkg-config
      - libssl-dev
    state: present
    update_cache: yes
  become: true

- name: Check if rustup toolchain is already installed
  ansible.builtin.stat:
    path: /usr/local/cargo/bin/cargo
  register: cargo_installed

- name: Install rustup toolchain
  ansible.builtin.shell: |
    curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal
  environment:
    RUSTUP_HOME: /usr/local/rustup
    CARGO_HOME: /usr/local/cargo
  when: not cargo_installed.stat.exists
  become: true

- name: Clone ooniprobe-rs repo
  ansible.builtin.git:
    repo: "{{ test_helpers_repo }}"
    dest: "/tmp/ooniprobe-rs"
    version: "{{ test_helpers_version }}"
    force: yes
  become: true

- name: Build the test-helpers crate in release mode
  ansible.builtin.command: /usr/local/cargo/bin/cargo build --release --package test-helpers
  args:
    chdir: "/tmp/ooniprobe-rs"
  environment:
    RUSTUP_HOME: /usr/local/rustup
    CARGO_HOME: /usr/local/cargo
    PATH: "/usr/local/cargo/bin:{{ ansible_env.PATH }}"
  become: true

- name: Make jsonth accessible system wide
  ansible.builtin.copy:
    src: "/tmp/ooniprobe-rs/target/release/jsonth"
    dest: "/usr/local/bin/"
    mode: '0755'
    remote_src: yes
  become: yes

- name: Make echo accessible system wide
  ansible.builtin.copy:
    src: "/tmp/ooniprobe-rs/target/release/echo"
    dest: "/usr/local/bin/"
    mode: '0755'
    remote_src: yes
  become: yes

- name: Clean up build directory
  ansible.builtin.file:
    path: "/tmp/ooniprobe-rs"
    state: absent
  become: yes

# Create systemd units

- name: Create <helper>.service file
  tags: test-helpers
  ansible.builtin.template:
    src: templates/{{helper}}.service
    dest: /etc/systemd/system/{{helper}}.service
    mode: '0755'
    owner: root
  notify:
    - "restart {{helper}}"

- name: reload systemd
  tags: test-helpers
  shell: systemctl daemon-reload

- name: Start helper
  tags: test-helpers
  systemd:
    name: "{{helper}}.service"
    state: started
    enabled: yes
