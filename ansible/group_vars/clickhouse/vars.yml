clickhouse_version: 24.8.6.70

clickhouse_config:
  max_connections: 4096
  keep_alive_timeout: 3
  max_concurrent_queries: 300
  max_server_memory_usage: 0
  max_thread_pool_size: 10000
  max_server_memory_usage_to_ram_ratio: 0.9
  # for 1GB/s 50% utilization cap
  max_replicated_sends_network_bandwidth_for_server: 62500000
  max_replicated_fetches_network_bandwidth_for_server: 62500000
  total_memory_profiler_step: 4194304
  total_memory_tracker_sample_probability: 0
  uncompressed_cache_size: 8589934592
  mark_cache_size: 5368709120
  # max_open_files: 262144
  mmap_cache_size: 1000
  compiled_expression_cache_size: 134217728
  compiled_expression_cache_elements_size: 10000
  # tmp_policy: tmp
  default_profile: default
  custom_settings_prefixes: ""
  system_profile: write
  # buffer_profile: default
  default_database: default
  # timezone:
  # umask: 027
  mlock_executable: true
  remap_executable: true
  builtin_dictionaries_reload_interval: 3600
  max_session_timeout: 3600
  default_session_timeout: 60
  # regions_hierarchy_file: /opt/geo/regions_hierarchy.txt
  # regions_names_files_path: /opt/geo/
  # top_level_domains_path: /var/lib/clickhouse/top_level_domains/
  # top_level_domains:  # Path to the list is under top_level_domains_path
  #   - domain:
  #     name: example_name
  #     path: /path/to/example_name.dat
  dictionaries_config: "*_dictionary.xml"
  user_defined_executable_functions_config: "*_function.xml"
  # max_table_size_to_drop: 0
  # max_partition_size_to_drop: 0
  format_schema_path: /var/lib/clickhouse/format_schemas/
  # disable_internal_dns_cache: 1

clickhouse_keeper:
  tcp_port: 9181
  log_storage_path: /var/lib/clickhouse/coordination/log
  snapshot_storage_path: /var/lib/clickhouse/coordination/snapshots
  coordination_settings:
    operation_timeout_ms: 10000
    session_timeout_ms: 30000
    raft_logs_level: trace
  keeper_servers:
  - keeper_server:
    server: data1.htz-fsn.prod.ooni.nu
    id: 1
    hostname: clickhouse1.prod.ooni.io
    port: 9234

  - keeper_server:
    server: data2.htz-fsn.prod.ooni.nu
    id: 2
    hostname: clickhouse2.prod.ooni.io
    port: 9234

  - keeper_server:
    server: data3.htz-fsn.prod.ooni.nu
    id: 3
    hostname: clickhouse3.prod.ooni.io
    port: 9234

clickhouse_zookeeper:
  - node:
    host: clickhouse1.prod.ooni.io
    port: 9181
  - node:
    host: clickhouse2.prod.ooni.io
    port: 9181
  - node:
    host: clickhouse3.prod.ooni.io
    port: 9181

clickhouse_remote_servers:
  - server:
    servername: oonidata_cluster
    secret: "{{ lookup('amazon.aws.aws_secret', 'oonidevops/clickhouse_oonidata_cluster_secret', profile='oonidevops_user_prod') }}"
    shards:
      - shard:
        internal_replication: true
        replicas:
          - replica:
            host: clickhouse1.prod.ooni.io
            port: 9000
          - replica:
            host: clickhouse2.prod.ooni.io
            port: 9000
          - replica:
            host: clickhouse3.prod.ooni.io
            port: 9000

clickhouse_macros:
  - macro: |
      <shard>01</shard>
      <replica>01</replica>
    server:
      - data1.htz-fsn.prod.ooni.nu
  - macro: |
      <shard>01</shard>
      <replica>02</replica>
    server:
      - data2.htz-fsn.prod.ooni.nu
  - macro: |
      <shard>01</shard>
      <replica>03</replica>
    server:
      - data3.htz-fsn.prod.ooni.nu
  - macro: |
      <cluster>oonidata_cluster</cluster>

clickhouse_distributed_ddl:
  path: "/clickhouse/task_queue/ddl"
  profile: "write"
  pool_size: 1
  task_max_lifetime: 604800
  cleanup_delay_period: 60
  max_tasks_in_queue: 1000

clickhouse_default_profiles:
  default:
    readonly: 2
    # 10 GB
    max_memory_usage: 10010010000
    use_uncompressed_cache: 0
    load_balancing: random
    max_partitions_per_insert_block: 100
  readonly:
    readonly: 1
    # 1 GB
    max_memory_usage: 1001001000
  write:
    readonly: 0
    max_memory_usage: 61001001000
  admin:
    readonly: 0

clickhouse_listen_hosts:
  - "::"

# Users examples
clickhouse_admin_user: admin
clickhouse_admin_password: "{{ lookup('amazon.aws.aws_ssm', '/oonidevops/secrets/clickhouse_admin_password', profile='oonidevops_user_prod') }}"

clickhouse_admin_users:
  - user:
    name: "{{ clickhouse_admin_user }}"
    password_sha256_hex: "{{ clickhouse_admin_password | hash('sha256') }}"
    networks:
      - "127.0.0.1"
      - "::1"
    profile: admin
    quota: "default"
    access_management: 1
    named_collection_control: 1
    show_named_collections: 1
    show_named_collections_secrets: 1

clickhouse_default_users:
  - user:
    name: default
    password:
    networks:
      - "127.0.0.1"
    profile: default
    quota: default
  - user:
    name: readonly
    password_sha256_hex: "{{ lookup('amazon.aws.aws_ssm', '/oonidevops/secrets/clickhouse_readonly_password', profile='oonidevops_user_prod') | hash('sha256') }}"
    networks:
      - "0.0.0.0/0"
    profile: readonly
    quota: default
  - user:
    name: write
    password_sha256_hex: "{{ lookup('amazon.aws.aws_ssm', '/oonidevops/secrets/clickhouse_write_password', profile='oonidevops_user_prod') | hash('sha256') }}"
    networks:
      - "0.0.0.0/0"
    profile: write
    quota: default

# SQL-driven users, quotas and grants (see the clickhouse role's README.md).
# Each user carries its own settings and sets readonly = 0, since a user without
# it gets the default profile's readonly = 2; what it may do comes from
# clickhouse_custom_grants.
clickhouse_role_manage_users: True
clickhouse_role_manage_quotas: True
clickhouse_role_manage_grants: True
# Off until each node has been checked for SQL users and quotas not listed here.
clickhouse_sql_objects_drop_unlisted: false

clickhouse_custom_users:
  - name: fastpath
    password_type: sha256_hash
    password: "{{ lookup('amazon.aws.aws_ssm', '/oonidevops/secrets/clickhouse_fastpath_password', profile='oonidevops_user_prod') | hash('sha256') }}"
    networks: ["IP '0.0.0.0/0'"]
    settings:
      - "readonly = 0"
      - "max_memory_usage = 61001001000"  # 61 GB

  # Only SELECT through its grants. CONST stops queries from raising its limits;
  # other settings, such as log_comment, can still be set per query.
  - name: oonimeasurements
    password_type: sha256_hash
    password: "{{ lookup('amazon.aws.aws_ssm', '/oonidevops/secrets/clickhouse_oonimeasurements_password', profile='oonidevops_user_prod') | hash('sha256') }}"
    networks: ["IP '0.0.0.0/0'"]
    settings:
      - "readonly = 0"
      - "max_memory_usage = 1001001000 CONST"                  # 1 GB
      - "max_execution_time = 30 CONST"                        # seconds
      - "max_bytes_to_read = 501001001000 CONST"               # 500 GB
      - "max_rows_to_read = 5001001000 CONST"                  # 5 B
      - "timeout_before_checking_execution_speed = 5 CONST"    # seconds
      - "max_result_rows = 51000 CONST"

  - name: ooniprobe
    password_type: sha256_hash
    password: "{{ lookup('amazon.aws.aws_ssm', '/oonidevops/secrets/clickhouse_ooniprobe_password', profile='oonidevops_user_prod') | hash('sha256') }}"
    networks: ["IP '0.0.0.0/0'"]
    settings:
      - "readonly = 0"
      - "max_memory_usage = 61001001000"  # 61 GB

  - name: oonirun
    password_type: sha256_hash
    password: "{{ lookup('amazon.aws.aws_ssm', '/oonidevops/secrets/clickhouse_oonirun_password', profile='oonidevops_user_prod') | hash('sha256') }}"
    networks: ["IP '0.0.0.0/0'"]
    settings:
      - "readonly = 0"
      - "max_memory_usage = 61001001000"  # 61 GB

  - name: oonitestlists
    password_type: sha256_hash
    password: "{{ lookup('amazon.aws.aws_ssm', '/oonidevops/secrets/clickhouse_oonitestlists_password', profile='oonidevops_user_prod') | hash('sha256') }}"
    networks: ["IP '0.0.0.0/0'"]
    settings:
      - "readonly = 0"
      - "max_memory_usage = 61001001000"  # 61 GB

  - name: notebook
    password_type: sha256_hash
    password: "{{ lookup('amazon.aws.aws_ssm', '/oonidevops/secrets/clickhouse_notebook_password', profile='oonidevops_user_prod') | hash('sha256') }}"
    networks: ["IP '0.0.0.0/0'"]
    settings:
      - "readonly = 0"
      - "max_memory_usage = 61001001000"  # 61 GB

clickhouse_custom_quotas:
  # Not assigned to the user (no `to`), so each node keeps its current assignment:
  # the API's node, data2, has never had a quota, and these limits were never
  # checked against its traffic.
  - name: oonimeasurements
    intervals:
      - "INTERVAL 600 second MAX queries = 12000, errors = 1000, execution_time = 1000"
  # No limits: these exist on the nodes already, and are listed so that they aren't
  # dropped if clickhouse_sql_objects_drop_unlisted is turned on
  - name: ooniprobe
  - name: oonirun
  # TODO: the old vars had oonimeasurements' limits here too, never applied anywhere
  - name: oonitestlists
  - name: notebook

clickhouse_custom_grants:
  - databases: [ooni, oonitest]
    tables: ["*"]
    privileges: [SELECT]
    to: [ooniprobe, oonimeasurements, oonirun, fastpath, notebook]
  - databases: [ooni, oonitest]
    tables: [url_priorities]
    privileges: [INSERT]
    to: [oonitestlists]
  - databases: [ooni, oonitest]
    tables: [faulty_measurements]
    privileges: [INSERT]
    to: [ooniprobe]
  - databases: [ooni, oonitest]
    tables: [fastpath, obs_web, obs_openvpn, jsonl, new_jsonl]
    privileges: [INSERT]
    to: [fastpath]

clickhouse_default_quotas:
  - quota:
    name: default
    duration: 3600
    queries: 0
    errors: 0
    result_rows: 0
    read_rows: 0
    execution_time: 0

clickhouse_prometheus:
  endpoint: "/metrics"
  port: 9363
  metrics: true
  events: true
  asynchronous_metrics: true
  status_info: true

prometheus_nginx_proxy_config:
  - location: /metrics/node_exporter
    proxy_pass: http://127.0.0.1:8100/metrics
  - location: /metrics/clickhouse
    proxy_pass: http://127.0.0.1:9363/metrics
